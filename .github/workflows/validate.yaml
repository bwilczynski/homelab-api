name: Validate

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: jdx/mise-action@v4
        with:
          install_args: go

      - name: Bundle spec
        run: make -C spec bundle

      - name: Generate server stubs
        run: make generate

      - name: Build
        run: make build

      - name: Test
        run: make test

  contract-test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: jdx/mise-action@v4

      - name: Contract tests
        run: make contract-test
